services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run, --token-file, /run/secrets/tunnel-token]
    secrets: [tunnel-token]
    networks:
      smartown:
        aliases: [cloudflared]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

secrets:
  tunnel-token:
    file: ./secrets/tunnel-token

networks:
  smartown:
    external: true
    name: smartown
