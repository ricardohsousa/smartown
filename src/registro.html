<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="SmarTown" />
    <meta name="description" content="SmarTown: registre e acompanhe problemas urbanos do seu bairro." />
    <title>SmarTown · Registrar problema</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="container">
      <section class="cartao cartao--registro">
        <h2>Registre o problema</h2>
        <form class="formulario-registro" id="formulario-registro">
          <div class="campo-registro">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="" selected disabled>Selecione uma categoria</option>
              <option value="iluminacao">Iluminação</option>
              <option value="via-publica">Via pública</option>
              <option value="descarte-irregular">Descarte irregular</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div class="campo-registro">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="4" maxlength="500" aria-describedby="contador-descricao" required></textarea>
            <small id="contador-descricao" class="contador-descricao" aria-live="polite">0/500 caracteres</small>
          </div>

          <div class="campo-registro">
            <label for="bairro">Bairro</label>
            <input id="bairro" name="bairro" type="text" required />
          </div>

          <div class="campo-registro">
            <label for="urgencia">Urgência</label>
            <select id="urgencia" name="urgencia" required>
              <option value="" selected disabled>Selecione a urgência</option>
              <option value="alto">Alto</option>
              <option value="medio">Médio</option>
              <option value="baixo">Baixo</option>
            </select>
          </div>

          <div class="acoes-registro">
            <button type="submit">Enviar</button>
            <a class="botao-voltar" href="index.html">Voltar</a>
          </div>
          <p id="mensagem-registro" class="mensagem-registro" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="rodape">
      <div class="container">
        <small>SmarTown · Gerência de Configuração e Manutenção de Software · UTFPR</small>
        <small id="versao" class="versao"></small>
      </div>
    </footer>
  </body>
</html>
